name: Submit a prompt
description: Share a Copilot prompt that worked for you on real work.
title: "[Prompt] "
labels: ["submission", "prompt"]
body:
  - type: input
    id: job
    attributes:
      label: Job to be done
      description: What does it help you do, in plain words?
      placeholder: Find the current version of a document and what changed
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [Copilot Chat, Outlook, Teams, Word, Excel, PowerPoint, SharePoint, Notebooks, Copilot Studio, Other]
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role
      placeholder: Finance, admin, project delivery, everyone…
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence needed
      options: [Copilot Chat (included), Microsoft 365 Copilot (paid), Copilot Studio (usage-based), Not sure]
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: The prompt
      description: Use [square brackets] for anything people need to fill in. Remove any real names.
    validations:
      required: true
  - type: textarea
    id: use-when
    attributes:
      label: Use when
    validations:
      required: true
  - type: textarea
    id: falls-short
    attributes:
      label: Where it falls short
      description: The honest bit. What did it get wrong, and what doesn't it do?
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time saved (rough guess is fine)
      placeholder: ~15 min per week
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested this on real work in the last 30 days
          required: true
        - label: I've removed client names, project names, people and internal system names
          required: true
